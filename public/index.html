<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vexifiy</title>
  <meta name="description" content="Unofficial VIQRC Level Up companion: local AI manual assistant, custom timers and a 3D field.">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="importmap">
    { "imports": {
      "three": "/vendor/three/build/three.module.js",
      "three/addons/": "/vendor/three/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div class="shell">
    <nav class="nav" aria-label="Main">
      <a class="brand" href="#/home" aria-label="Vexifiy home">
        <img src="/logo.svg" alt="" width="30" height="30"><span>Vexifiy</span>
      </a>
      <a class="nav-item" data-view="home" href="#/home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span>Home</span></a>
      <a class="nav-item" data-view="ask" href="#/ask"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Ask AI</span></a>
      <a class="nav-item" data-view="rules" href="#/rules"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>Rules</span></a>
      <a class="nav-item" data-view="code" href="#/code"><svg viewBox="0 0 24 24"><path d="M4 5h7v4H8v2H4zM4 13h10v4h-3v2H4zM15 7h5M17.5 4.5v5"/></svg><span>Code</span></a>
      <a class="nav-item" data-view="interview" href="#/interview"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.3 2.8-5 5.5-5s4.9 1.7 5.5 5M15 4.5h6v5h-3.5L15 12z"/></svg><span>Interview</span></a>
      <a class="nav-item" data-view="timers" href="#/timers"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg><span>Timers</span></a>
      <a class="nav-item" data-view="field" href="#/field"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5M3 8v5M21 8v5"/></svg><span>3D Field</span></a>
      <p class="nav-foot">Unofficial fan-made tool. Not affiliated with VEX Robotics or the REC Foundation.</p>
    </nav>
    <main id="main">
      <section id="view-home" class="view"></section>
      <section id="view-ask" class="view"></section>
      <section id="view-rules" class="view"></section>
      <section id="view-code" class="view"></section>
      <section id="view-interview" class="view"></section>
      <section id="view-timers" class="view"></section>
      <section id="view-field" class="view"></section>
    </main>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
